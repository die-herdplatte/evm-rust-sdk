[package]
name = "ekubo_sdk_evm_wasm"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"
description = "TypeScript/WASM bindings for ekubo_sdk EVM pools"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
derive_more = { version = "2", features = ["from"], default-features = false }
ekubo_sdk = { path = "../..", default-features = false, features = [
    "std",
    "serde",
    "evm",
] }
itertools = "0.14.0"
wasm-bindgen = "0.2"
js-sys = "0.3.91"
serde = "1.0.228"
tsify = { version = "0.5.6", features = [
    "js",
], git = "https://github.com/madonoharu/tsify", rev = "d89d5c1d16a83c0370109232c9197fc2fa072564" } # crates.io release lacks `Ts` wrapper needed by these bindings.

[dev-dependencies]
wasm-bindgen-test = "0.2"
